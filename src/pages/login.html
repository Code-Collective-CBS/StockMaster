<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/src/base/color.css" />
    <link rel="stylesheet" href="/src/base/typography.css" />
    <link rel="stylesheet" href="/src/layouts/login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>StockMaster</h1>
      <h2>Login to your account</h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="text"
            id="email"
            name="email"
            placeholder="Email"
            required
          />
        </div>

        <div class="form-group">
          <label for="adgangskode">Password:</label>
          <input
            type="password"
            id="adgangskode"
            name="adgangskode"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit" id="login">Login</button>
      </form>

      <div class="register-link">
        <a href="../../src/pages/sign-up.html"
          >Don't have a user? Register here</a>
      </div>
    </div>
  </body>
  <script src="/src/scripts/login.js" type="module" ></script>
</html>
