<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create User</title>
  <link rel="stylesheet" href="/src/layouts/sign-up.css" />
  <link rel="stylesheet" href="/src/base/color.css" />
  <link rel="stylesheet" href="/src/base/typography.css" />

  <!---Google Font--->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
  <main class="login-container">
    <section class="left-column">
      <div class="logo-section">
        <h1>StockMaster</h1>
      </div>
      <div class="welcome-section">
        <h2>Welcome Back</h2>
        <p>If you already have a user, you can log in here.</p>
        <button class="login-button">Login</button>
      </div>
    </section>

    <section class="right-column">
      <div class="registration-form">
        <h2>Create user</h2>
        <form id="registerForm">
          <div class="form-row">
            <div class="form-group">
              <label for="firstname">First name</label>
              <input type="text" id="firstname" name="firstname" placeholder="First name" required />
            </div>
            <div class="form-group">
              <label for="lastname">Last name</label>
              <input type="text" id="lastname" name="lastname" placeholder="Last name" required />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required />
          </div>

          <div class="form-group">
            <label for="telefon">Telephone number</label>
            <input type="tel" id="telefon" name="telefon" placeholder="Telephone number" />
          </div>

          <div class="form-group">
            <label for="new-password">Password</label>
            <input type="password" id="new-password" name="new-password" placeholder="Password" required />
          </div>

          <div class="form-group">
            <label>Choose an avatar</label>
            <div class="avatar-selection">
              <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Alex" class="avatar-option" data-avatar="Alex" />
              <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Milo" class="avatar-option" data-avatar="Milo" />
              <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Zoe" class="avatar-option" data-avatar="Zoe" />
              <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Finn" class="avatar-option" data-avatar="Finn" />
            </div>
          </div>
          <input type="hidden" id="selectedAvatar" name="avatar" />

          <div class="form-buttons">
            <button type="button" class="cancel-button">Cancel</button>
            <button type="submit" class="save-button">Create</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    document
      .querySelector(".login-button")
      .addEventListener("click", function () {
        window.location.href = "../pages/login.html";
      });
  </script>

  <script src="../scripts/sign-up.js"></script>
</body>

</html>
